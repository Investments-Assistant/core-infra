name: OpenTofu — All

on:
  push:
    branches: [main]
    paths:
      - opentofu/**
  workflow_dispatch:
    inputs:
      tf_env:
        description: "OpenTofu workspace and tfvars prefix"
        required: false
        default: prod
        type: string

jobs:
  aws:
    name: AWS
    uses: ./.github/workflows/opentofu-aws.yml
    with:
      tf_env: ${{ inputs.tf_env || 'prod' }}
    secrets: inherit

  github:
    name: GitHub
    uses: ./.github/workflows/opentofu-github.yml
    with:
      tf_env: ${{ inputs.tf_env || 'prod' }}
    secrets: inherit
    needs: aws
