name: OpenTofu — AWS

on:
  push:
    branches: [main]
    paths:
      - opentofu/aws/**
  workflow_dispatch:
    inputs:
      tf_env:
        description: "OpenTofu workspace and tfvars prefix"
        required: false
        default: prod
        type: string
  workflow_call:
    inputs:
      tf_env:
        description: "OpenTofu workspace and tfvars prefix"
        required: false
        default: prod
        type: string

jobs:
  apply:
    name: Apply AWS Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ inputs.tf_env || 'prod' }}
    env:
      AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_ENV:                ${{ inputs.tf_env || 'prod' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.2"

      - name: Write tfvars
        run: printf '%s' "$TFVARS_CONTENT" > "opentofu/aws/${TF_ENV}.tfvars"
        env:
          TFVARS_CONTENT: ${{ secrets.AWS_TFVARS }}

      - name: Export AWS region
        run: |
          region="$(awk -F'"' '/region[[:space:]]*=/ { print $2; exit }' opentofu/aws/backend.tf)"
          echo "AWS_REGION=${region}" >> "$GITHUB_ENV"

      - name: Init
        run: tofu -chdir=opentofu/aws init -reconfigure -upgrade

      - name: Select workspace
        run: tofu -chdir=opentofu/aws workspace select -or-create "$TF_ENV"

      - name: Validate
        run: tofu -chdir=opentofu/aws validate -var-file="${TF_ENV}.tfvars"

      - name: Plan
        run: tofu -chdir=opentofu/aws plan -var-file="${TF_ENV}.tfvars" -out=ttplan -json-into=ttplan.json

      - name: Apply
        run: tofu -chdir=opentofu/aws apply -auto-approve -json-into=ttoutputs.json ttplan
